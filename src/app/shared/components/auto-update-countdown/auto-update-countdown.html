<div class="modal-header bg-dark border-secondary">
  <h5 class="modal-title text-white fw-bold d-flex align-items-center gap-2">
    <i class="bi bi-arrow-repeat text-warning"></i>
    <span>Automatic Update Starting</span>
  </h5>
</div>
<div class="modal-body bg-dark text-white border-secondary text-center py-4">
  <p class="mb-2">The configured update sequence will begin automatically in:</p>
  <div class="display-4 fw-bold text-warning mb-2">{{ secondsRemaining() }}s</div>
  <p class="text-white-50 small mb-0">Press Cancel to skip this automatic update.</p>
</div>
<div class="modal-footer bg-dark border-secondary justify-content-center">
  <button type="button" class="btn btn-outline-secondary btn-sm px-4" (click)="onCancel()">
    <i class="bi bi-x-circle me-1"></i> Cancel
  </button>
</div>
