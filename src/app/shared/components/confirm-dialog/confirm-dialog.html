<div class="modal-header bg-dark border-secondary">
  <h5 class="modal-title text-white fw-bold d-flex align-items-center gap-2">
    <i class="bi bi-exclamation-triangle-fill text-warning"></i>
    <span>{{ title() }}</span>
  </h5>
  <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="onCancel()"></button>
</div>
<div class="modal-body bg-dark text-white border-secondary text-sm">
  <p class="mb-0">{{ message() }}</p>
</div>
<div class="modal-footer bg-dark border-secondary">
  <button type="button" class="btn btn-xs px-3" [ngClass]="cancelStyle()" (click)="onCancel()">
    {{ cancelText() }}
  </button>
  <button type="button" class="btn btn-xs px-3" [ngClass]="confirmStyle()" (click)="onConfirm()">
    {{ confirmText() }}
  </button>
</div>
